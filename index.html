function render(){ $('nav').setAttribute('role','tablist');$('nav').setAttribute('aria-label','Módulos do laboratório');$('main').setAttribute('role','tabpanel');$('main').setAttribute('aria-labelledby','tab-'+tab);$('nav').innerHTML=tabs.map((t,i)=>`<button id="tab-${i}" role="tab" aria-selected="${i===tab}" aria-controls="main" tabindex="${i===tab?0:-1}" onkeydown="tabKey(event,${i})" class="${i===tab?'active':''}" onclick="activateTab(${i})">${t}</button>`).join('');let m=$('main');if(tab===12){aboutRender();return}if(tab===11){auditRender();return}if(tab===10){instrumentRender();return}if(tab===9){unknownRender();return}if(tab===8){depthRender();return}if(tab===7){importRender();return}if(tab===6){libraryRender();return}if(tab===5){fitRender();return}if(tab===0){m.innerHTML=`<div class="panel"><h2>Efeito fotoelétrico</h2><svg viewBox="0 0 650 220"><rect x="60" y="145" width="530" height="55" fill="#426577"/><text x="260" y="178" fill="white">Amostra</text><path d="M80 20 L280 145" stroke="#f4c45d" stroke-width="5"/><path d="M280 145 Q350 20 530 30" stroke="#70d9ee" stroke-width="4" fill="none"/><circle cx="280" cy="145" r="8" fill="white"/><circle cx="530" cy="30" r="7" fill="#70d9ee"/><text x="80" y="16" fill="#f4c45d">Fóton Al Kα</text><text x="400" y="18" fill="#70d9ee">Fotoelétron</text></svg><p>Eᵦ = hν − Eₖ − φ</p><label>Energia de ligação (eV): <output id="be">285</output><input type="range" min="0" max="1200" value="285" oninput="$('be').value=this.value;$('ke').textContent=(1486.6-this.value-4.5).toFixed(1)"></label><h3>Energia cinética: <span id="ke">1197.1</span> eV</h3><p>Fonte Al Kα: 1486,6 eV; função trabalho do espectrômetro (ilustrativa): 4,5 eV. XPS analisa tipicamente os primeiros nanômetros da superfície. O vácuo reduz colisões e contaminação; a profundidade depende do material, energia e geometria.</p></div>`}if(tab===1){m.innerHTML=`<div class="layout"><div class="panel"><label>Amostra<select id="sample" onchange="sample=+this.value;region='Survey';render()">${samples.map((s,i)=>`<option value="${i}" ${sample===i?'selected':''}>${s.name}</option>`).join('')}</select></label><label>Região<select onchange="region=this.value;draw()">${['Survey',...new Set(samples[sample].peaks.map(p=>p[0]))].map(r=>`<option ${r===region?'selected':''}>${r}</option>`).join('')}</select></label><label>Energia de passagem: <span id="pv">${pass}</span> eV<input type="range" min="10" max="160" step="10" value="${pass}" oninput="pass=+this.value;$('pv').textContent=pass;draw()"></label><label>Varreduras: <span id="sv">${scans}</span><input type="range" min="1" max="32" value="${scans}" oninput="scans=+this.value;$('sv').textContent=scans;draw()"></label><label>Carregamento: <span id="cv">${charge}</span> eV<input type="range" min="0" max="5" step="0.1" value="${charge}" oninput="charge=+this.value;$('cv').textContent=charge;draw()"></label><label><input type="checkbox" ${show?'checked':''} onchange="show=this.checked;draw()"> Identificar picos</label><button onclick="seed++;draw()">Adquirir novamente</button> <button onclick="exportCSV()">CSV</button></div><div class="panel"><h2>Espectro simulado</h2><canvas id="plot"></canvas><p id="cursor" class="note">Toque no gráfico para consultar energia e intensidade.</p><p class="note">Eixo de energia de ligação decrescente. Modelo gaussiano simplificado; maior energia de passagem alarga picos e melhora a relação sinal/ruído neste modelo.</p></div></div>`;draw();$('plot').onpointermove=e=>{let r=e.target.getBoundingClientRect(),f=(e.clientX-r.left-55)/(r.width-75);if(f>=0&&f<=1){let i=Math.round(f*(data.length-1));$('cursor').textContent=`Energia: ${data[i][0].toFixed(2)} eV | Intensidade: ${data[i][1].toFixed(1)} u.a.`}};$('plot').onpointerdown=$('plot').onpointermove;}if(tab===2){let p=samples[sample].peaks,groups={};p.forEach(([n,e,a,r])=>{groups[n]??=[0,r];groups[n][0]+=a*r});m.innerHTML=`<div class="panel"><h2>Composição atômica superficial</h2><label>Amostra <select onchange="sample=+this.value;region='Survey';render()">${samples.map((s,i)=>`<option value="${i}" ${sample===i?'selected':''}>${s.name}</option>`).join('')}</select></label><p>At% = 100 × (Aᵢ/Sᵢ) / Σ(Aⱼ/Sⱼ)</p><table><thead><tr><th>Região</th><th>Área líquida</th><th>RSF</th><th>At%</th></tr></thead><tbody>${Object.entries(groups).map(([n,[a,r]])=>`<tr><td>${n}</td><td><input style="width:85px" type="number" min="0" value="${a.toFixed(2)}" oninput="quant()"></td><td><input style="width:75px" type="number" min="0.001" step="0.01" value="${r}" oninput="quant()"></td><td class="pct"></td></tr>`).join('')}</tbody></table><p class="note">Áreas ideais sintéticas, não extraídas do gráfico ruidoso. RSFs ilustrativos, não certificados para Kratos. Não inclui hidrogênio; quantificação real exige fundo, transmissão e fatores instrumentais adequados.</p></div>`;quant()}if(tab===3){let q=questions[quiz];m.innerHTML=`<div class="panel"><h2>Desafio ${quiz+1}/${questions.length}</h2><p>${q[0]}</p>${q[1].map((a,i)=>`<p><button onclick="quizAnswer(${i})">${a}</button></p>`).join('')}<p id="feedback" aria-live="polite"></p><button onclick="quiz=(quiz+1)%questions.length;render()">Próximo desafio</button></div>`}if(tab===4)m.innerHTML=`<div class="panel"><h2>Referências e limites</h2><p><a href="https://srdata.nist.gov/xps/">NIST XPS Database</a> — energias de ligação e referências experimentais.</p><p><a href="https://www.kratos.com/">Kratos Analytical</a> — documentação do fabricante.</p><p>Shirley, D. A. Phys. Rev. B 5, 4709 (1972). DOI: 10.1103/PhysRevB.5.4709. Tougaard, S. Surf. Interface Anal. 11, 453–472 (1988).<br>Watts, J. F.; Wolstenholme, J. An Introduction to Surface Analysis by XPS and AES. Wiley, 2003.</p><p>Esta aplicação é um simulador conceitual, não um procedimento operacional. Não reproduz todos os picos, satélites, perdas, linhas Auger ou efeitos de matriz. Operação real somente conforme treinamento e procedimentos locais.</p></div>`}
function quant(){let rows=[...document.querySelectorAll('tbody tr')],v=rows.map(r=>{let [a,s]=r.querySelectorAll('input');return +a.value>=0&&+s.value>0?+a.value/+s.value:NaN}),sum=v.reduce((a,b)=>a+b,0);rows.forEach((r,i)=>r.querySelector('.pct').textContent=sum>0?(100*v[i]/sum).toFixed(2):'—')}
let data=[];function draw(){let c=$('plot');if(!c)return;let w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;let ctx=c.getContext('2d');ctx.scale(d,d);let p=samples[sample].peaks.filter(p=>region==='Survey'||p[0]===region),hi=region==='Survey'?1100:Math.max(...p.map(x=>x[1]))+10+charge,lo=region==='Survey'?0:Math.min(...p.map(x=>x[1]))-10+charge;let rng=seed;function random(){rng=(Math.imul(1664525,rng)+1013904223)>>>0;return rng/4294967296}data=Array.from({length:2201},(_,i)=>{let x=hi-(hi-lo)*i/2200,y=4+0.005*x;for(let [n,e,a,r,b] of p){let s=Math.sqrt(b*b+(pass/100)**2)/2.355;y+=a*r/(s*Math.sqrt(2*Math.PI))*Math.exp(-0.5*((x-e-charge)/s)**2)}y+= (random()-.5)*6/Math.sqrt(scans*pass/40);return [x,Math.max(0,y)]});let max=Math.max(...data.map(x=>x[1]))*1.18,X=x=>55+(hi-x)/(hi-lo)*(w-75),Y=y=>h-45-y/max*(h-65);ctx.strokeStyle='#526571';ctx.fillStyle='#c8d9e3';ctx.font='12px system-ui';for(let i=0;i<=5;i++){let x=hi-(hi-lo)*i/5;ctx.beginPath();ctx.moveTo(X(x),20);ctx.lineTo(X(x),h-45);ctx.stroke();ctx.fillText(x.toFixed(region==='Survey'?0:1),X(x)-12,h-27);let y=max*i/5;ctx.fillText(y.toFixed(0),8,Y(y)+4)}ctx.fillText('Energia de ligação (eV)',w/2-65,h-7);ctx.fillText('u.a.',8,14);ctx.strokeStyle='#63d6ed';ctx.beginPath();data.forEach(([x,y],i)=>i?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y)));ctx.stroke();if(show){ctx.fillStyle='#f4c45d';let seen=new Set();p.forEach(([n,e])=>{if(region==='Survey'&&seen.has(n))return;seen.add(n);let x=X(e+charge);if(x>=55&&x<=w-20)ctx.fillText(region==='Survey'?n:e.toFixed(1),Math.min(x-12,w-65),32+seen.size%2*15)})};accessibleSpectra();}
function exportCSV(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['BE_eV,intensidade_ua\n'+data.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='xps_sintetico.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}window.addEventListener('resize',draw);
const cases=[{name:'Polietileno oxidado — C 1s',lo:280,hi:294,truth:[[284.8,70,1.1],[286.3,12,1.2],[288.8,5,1.3]],labels:['C–C / C–H','C–O','O–C=O'],hint:'Componentes compatíveis com oxidação; C=O também pode ocorrer. A posição isolada não prova a atribuição.'},{name:'Sílica — O 1s',lo:527,hi:539,truth:[[532.8,60,1.3],[534.1,9,1.5]],labels:['Si–O','OH / água adsorvida (possível)'],hint:'Ombros podem indicar grupos superficiais ou água, mas requerem confirmação independente.'},{name:'TiO₂ — Ti 2p',lo:452,hi:472,truth:[[458.6,20,1.1],[464.3,10,1.3]],labels:['Ti 2p₃/₂','Ti 2p₁/₂'],hint:'O dubleto de Ti⁴⁺ tem separação próxima de 5,7 eV e razão de áreas aproximada 2:1. O ajuste livre não impõe essas restrições.'}];
let fc=0,fp=[],fd=[],fb=[3,0.08],fs=1,noise=0.35,blind=false,fitmsg='',kOverride=null,fcolors=['#f4c45d','#70d9ee','#f69db0','#a6db8b','#c4a7ff','#ff9b63'];

let profile='Gaussian',bgtype='Linear',eta=0.5,truthProfile='Gaussian',truthBg='Linear',truthEta=.5,truthTs=1,bgcache=[],bgwarning='',tc=1643,tb=2866,ts=1;
function lorentz(x,p){let g=p[2]/2;return p[1]*g/(Math.PI*((x-p[0])**2+g*g))}
const wa=[-1.3031797863050087e-12, 3.7408812931653625e-12, 8.03036789996389e-12, -2.154363207783877e-11, -5.5442359481664624e-11, 1.1658251093523774e-10, 4.153743091833453e-10, -5.231020481196329e-10, -3.208015091723369e-09, 8.124889456846652e-10, 2.3797556779897417e-08, 2.2930439065099966e-08, -1.4813078915120977e-07, -4.1840763702169776e-07, 4.2558331375750085e-07, 4.40153173157855e-06, 6.821031944001985e-06, -2.140961920171075e-05, -0.00013075449254615346, -0.0002453298027002143, 0.0003925913607007031, 0.004519541105349217, 0.019006155784845408, 0.05730440352983722, 0.14060716226893769, 0.2954445107150873, 0.5460139720639341, 0.9019254893647999, 1.345544169234545, 1.8256696296324815, 2.2635372999002676, 2.5722534081245696],wL=4.756828460010884;
function voigtUnit(x,sig,g){let u=x/(Math.SQRT2*sig),v=g/(Math.SQRT2*sig),d=wL+v,den=d*d+u*u,zr=((wL-v)*d-u*u)/den,zi=2*wL*u/den,ar=0,ai=0;for(let c of wa){let r=ar*zr-ai*zi+c;ai=ar*zi+ai*zr;ar=r}let ir=d/den,ii=u/den;return (2*(ar*(ir*ir-ii*ii)-ai*2*ir*ii)+ir/Math.sqrt(Math.PI))/(sig*Math.sqrt(2*Math.PI))}
function shape(x,p,kind=profile,mix=eta){if(kind==='Gaussian')return gauss(x,p);if(kind==='Lorentzian')return lorentz(x,p);if(kind==='Pseudo-Voigt')return (1-mix)*gauss(x,p)+mix*lorentz(x,p);return p[1]*voigtUnit(x-p[0],p[2]/2.354820045,p[2]*mix/2)}
function background(rows,kind,scale=ts){let n=rows.length,dx=Math.abs(rows[1][0]-rows[0][0]),y=rows.map(r=>r[1]),edge=8,hi=y.slice(0,edge).reduce((a,b)=>a+b,0)/edge,lo=y.slice(-edge).reduce((a,b)=>a+b,0)/edge;bgwarning='';if(kind==='Linear')return rows.map(([x])=>fb[0]+fb[1]*(x-cases[fc].lo));if(kind==='Shirley'){let b=y.map((_,i)=>hi+(lo-hi)*i/(n-1)),ok=false;for(let k=0;k<150;k++){let a=Array(n).fill(0);for(let i=n-2;i>=0;i--)a[i]=a[i+1]+dx*((y[i]-b[i])+(y[i+1]-b[i+1]))/2;if(a[0]<=1e-10){bgwarning='Shirley: integral líquida não positiva; fundo de extremos usado.';return y.map((_,i)=>hi+(lo-hi)*i/(n-1))}let next=a.map((v,i)=>0.5*b[i]+0.5*(lo+(hi-lo)*v/a[0]));let err=Math.max(...next.map((v,i)=>Math.abs(v-b[i])));b=next;if(err<1e-7){ok=true;break}}if(!ok)bgwarning='Shirley: não convergiu; examine os extremos.';return b}return rows.map(([x],i)=>{let a=0;for(let j=i+1;j<n;j++){let t=rows[i][0]-rows[j][0];a+=Math.max(0,y[j]-lo)*tb*t/((tc+t*t)**2)*dx}return lo+scale*a})}
function refreshBg(){bgcache=bgtype==='Linear'?[]:background(fd,bgtype)}
function bg(x){if(bgtype==='Linear')return fb[0]+fb[1]*(x-cases[fc].lo);let c=cases[fc],i=Math.max(0,Math.min(fd.length-1,Math.round((c.hi-x)/(c.hi-c.lo)*(fd.length-1))));return bgcache[i]??0}
function changeModel(){kOverride=null;refreshBg();fitmsg='';fitRender()}

function gauss(x,p){let z=p[2]/2.354820045;return p[1]/(z*Math.sqrt(2*Math.PI))*Math.exp(-0.5*((x-p[0])/z)**2)}
function model(x){return bg(x)+fp.reduce((a,p)=>a+shape(x,p),0)}
function generateFit(){kOverride=null;fitmsg="";if(fc===3)return;let c=cases[fc],r=fs;function u(){r=(Math.imul(1664525,r)+1013904223)>>>0;return (r+0.5)/4294967296}fd=Array.from({length:401},(_,i)=>{let x=c.hi-(c.hi-c.lo)*i/400;return [x,3+0.08*(x-c.lo)+c.truth.reduce((a,p)=>a+shape(x,p,truthProfile,truthEta),0)+noise*Math.sqrt(-2*Math.log(u()))*Math.cos(2*Math.PI*u())]});if(truthBg!=='Linear'){let clean=fd.map(([x])=>[x,3+c.truth.reduce((a,p)=>a+shape(x,p,truthProfile,truthEta),0)]);let b=truthBg==='Shirley'?clean.map((_,i)=>{let a=0;for(let j=i;j<clean.length;j++)a+=Math.max(0,clean[j][1]-3);return a}):background(clean,'Tougaard',truthTs);let total=b[0]||1;fd=fd.map(([x,y],i)=>[x,y-0.08*(x-c.lo)+(truthBg==='Shirley'?8*b[i]/total:b[i]-3)])}refreshBg();}
function resetFit(){kOverride=null;if(fc===3){initImported();return;}let c=cases[fc];fp=[[c.truth[0][0]+0.3,c.truth[0][1]*0.8,1.5]];fb=[2,0];fitmsg='';generateFit()}
function sse(){return fd.reduce((a,[x,y])=>a+(y-model(x))**2,0)}
